name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build zip
        run: |
          zip -r "scavengesurvive-mta-${GITHUB_REF_NAME}.zip" resources sql README.md LICENSE LICENSE-MPL-2.0 \
            LICENSE-CC-BY-SA-4.0 THIRD_PARTY_NOTICES.md -x 'resources/*/models/files/*'
      - uses: softprops/action-gh-release@v3
        with:
          files: scavengesurvive-mta-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
