# Deploys site/ to https://www.scavengesurvive-reborn.com (juniper), turns GitHub Pages into a redirect there, and mirrors
# wiki/ to the repository's wiki.
#
# The site job rsyncs site/ as deploy-ssr, whose key only reaches /var/www/scavengesurvive-reborn.com/public through
# rrsync (docs/runbooks/website-hosting.md). Secrets: JUNIPER_DEPLOY_KEY (private key), JUNIPER_KNOWN_HOSTS
# (ssh-keyscan of juniper.flaviopereira.dev). The pages job keeps viruxe.github.io/scavengesurvive-mta/ working for old
# links: every path there forwards to the same path on the domain. The wiki job needs the wiki to exist (create any page
# once in the UI); it pushes with the workflow's own token.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wiki/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://www.scavengesurvive-reborn.com

jobs:
  site:
    name: Deploy the website to juniper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: website
      url: https://www.scavengesurvive-reborn.com
    steps:
      - uses: actions/checkout@v4
      - name: Install the deploy key
        env:
          KEY: ${{ secrets.JUNIPER_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.JUNIPER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Rsync site/
        run: |
          rsync -rlz --delete --chmod=D755,F644 --exclude PLACEHOLDERS.md \
            site/ deploy-ssr@juniper.flaviopereira.dev:/

  pages:
    name: Redirect GitHub Pages to the domain
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Build the redirect pages
        run: |
          mkdir -p redirect
          cat > redirect/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Scavenge & Survive has moved</title>
          <link rel="canonical" href="${SITE_URL}/">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=${SITE_URL}/">
          <script>location.replace("${SITE_URL}" + location.pathname.replace(/^\/scavengesurvive-mta/, "") + location.search + location.hash);</script>
          </head>
          <body><p>The website moved to <a href="${SITE_URL}/">${SITE_URL#https://}</a>.</p></body>
          </html>
          EOF
          cp redirect/index.html redirect/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deploy
        uses: actions/deploy-pages@v4

  wiki:
    name: Mirror wiki/ to the GitHub wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Clone the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/wiki
      - name: Replace every page, keep images/
        run: |
          cd /tmp/wiki
          find . -maxdepth 1 -name '*.md' -delete
          cp "$GITHUB_WORKSPACE"/wiki/*.md .
          git add -A
          if git diff --cached --quiet; then echo "wiki unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs(wiki): mirror wiki/ from ${GITHUB_SHA::7}"
          git push
