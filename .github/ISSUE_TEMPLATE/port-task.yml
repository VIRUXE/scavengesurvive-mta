name: Port task
description: Port, replace, drop or defer one upstream subsystem (one port-matrix cluster)
title: "[port] "
labels: [kind/feature]
body:
  - type: input
    id: upstream
    attributes:
      label: Upstream files
      placeholder: gamemodes/sss/core/vehicle/fuel.pwn
    validations:
      required: true
  - type: dropdown
    id: class
    attributes:
      label: Port class (triage adds the matching port/* label)
      options: [port, replace, drop, defer]
    validations:
      required: true
  - type: input
    id: resource
    attributes:
      label: Target resource / module
      placeholder: vehicles/server/fuel.lua
  - type: textarea
    id: essence
    attributes:
      label: What the player experiences (essence to keep)
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] busted / pytest cover the pure logic and procedures
        - [ ] playtest checklist row added to docs
