[project]
name = "scavengesurvive-mta-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyMySQL>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests/tools", "tests/sql"]
pythonpath = ["."]

[tool.setuptools]
packages = ["tools", "tools.convert"]
