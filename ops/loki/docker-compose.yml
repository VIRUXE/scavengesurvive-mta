# Local Loki + Grafana for development: `docker compose -f ops/loki/docker-compose.yml up -d`, then set
# *logs.url to http://127.0.0.1:3100 in server-config/local.settings.xml (no credentials, auth_enabled is false).
# Grafana: http://127.0.0.1:3000 (anonymous admin, local use only) with the Loki data source and the dashboards of
# ops/grafana already provisioned.
services:
  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - ./rules.yaml:/loki/rules/fake/rules.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
volumes:
  loki-data:
  grafana-data:
